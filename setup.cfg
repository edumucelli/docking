# Shim for older setuptools that can't read pyproject.toml PEP 621 metadata.
# The canonical config is in pyproject.toml.
[metadata]
name = docking
version = 2.4.1
[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
include = docking*

[options.entry_points]
console_scripts =
    docking = docking.app:main
    docking-camshield-helper = docking.applets.camshield.helper:main

[options.package_data]
docking =
    assets/*.svg
    assets/*.png
    assets/clock/Default/*.svg
    assets/clock/Default24/*.svg
    assets/icons/*.png
    assets/icons/applets/*.png
    assets/themes/*.json
    assets/*.csv.gz
    assets/sounds/*.ogg
    assets/sounds/*.md
    assets/history/*.json
    assets/stretch/*.json
    platform/backends/wayland/protocols/*.xml
    locale/*.pot
    locale/*/LC_MESSAGES/*.mo
    locale/*/LC_MESSAGES/*.po
