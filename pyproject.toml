[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "setuptools>=64.0; platform_system == 'Windows'",
    "wheel>=0.38.2; platform_system == 'Windows'",
]
build-backend = "setuptools.build_meta"

[project]
name = "docking"
version = "2.31.0"
description = "A lightweight, feature-rich dock for Linux and BSD written in Python with GTK 3 and Cairo"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "psutil>=6.0; platform_system == 'FreeBSD' or platform_system == 'OpenBSD' or platform_system == 'NetBSD' or platform_system == 'Windows'",
    "numpy>=1.20; platform_system == 'Windows'",
]

[project.scripts]
docking = "docking.launcher:main"
docking-camshield-helper = "docking.applets.camshield.helper:main"

[project.optional-dependencies]
wayland = [
    "pywayland>=0.4.18",
]
dev = [
    "behave>=1.2.6",
    "numpy>=1.24",
    "Pillow>=11.0",
    "pytest>=7.0",
    "pytest-cov",
    "setuptools>=64.0",
    "wheel>=0.38.2",
    "ruff==0.17.4",
    "ty==0.0.99",
    "vulture>=2.16",
]

[tool.uv]
config-settings-package = { pygobject-stubs = { config = "Gtk3,Gdk3" } }

[tool.setuptools.packages.find]
include = ["docking*"]

[tool.setuptools.package-data]
docking = [
    "assets/*.svg",
    "assets/*.png",
    "assets/clock/Default/*.svg",
    "assets/clock/Default24/*.svg",
    "assets/icons/*.png",
    "assets/icons/applets/*.png",
    "assets/themes/*.json",
    "assets/*.csv.gz",
    "assets/sounds/*.ogg",
    "assets/sounds/*.md",
    "assets/history/*.json",
    "assets/stretch/*.json",
    "platform/backends/wayland/protocols/*.xml",
    "platform/backends/kwin/*.js",
    "platform/native/windows/input_hook.cpp",
    "platform/native/windows/input-thread-*.dll",
    "locale/*.pot",
    "locale/*/LC_MESSAGES/*.mo",
    "locale/*/LC_MESSAGES/*.po",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not visual"'
markers = [
    "visual: screenshot-based visual regression tests",
]


[tool.coverage.run]
omit = [
    "docking/platform/__init__.py",
    "docking/platform/diagnostics.py",
    "docking/platform/gamescope.py",
    "docking/platform/icon_overrides.py",
    "docking/platform/model.py",
    "docking/platform/unity.py",
    "docking/platform/backends/**",
    "docking/platform/environment/**",
    "docking/platform/status_notifier/**",
    "docking/ui/preview.py",
    "docking/ui/renderer.py",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RUF", "PIE", "RET", "ISC", "PTH"]
ignore = [
    "E402",   # gi.require_version() must precede gi.repository imports
    "RUF001", # allow existing non-ASCII UI/test glyphs
    "RUF002", # avoid broad docstring punctuation churn
    "RUF003", # avoid broad comment punctuation churn
]  

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # test data strings can exceed line length
"tests/applets/test_weather_api.py" = ["N802"]

[tool.ty.environment]
python-version = "3.10"
# Always resolve Docking imports from this checkout before installed releases.
extra-paths = [".", "typings"]

[tool.ty.src]
# Generated pywayland bindings: the request/event decorators build their
# proxies dynamically, so every method returns Unknown by construction.
exclude = ["docking/platform/backends/wayland/protocols/"]

[tool.ty.analysis]
strict-generic-narrowing = true
strict-equality-semantics = true
# Suppressions must use ty's rule-specific syntax.
respect-type-ignore-comments = false
# System Cairo and BSD-only psutil need not be installed in the quality job.
# GI namespaces and optional PyWayland modules are absent in some installations.
allowed-unresolved-imports = [
    "cairo",
    "psutil",
    "gi.repository.NM",
    "gi.repository.GtkLayerShell",
    "gi.repository.Wnck",
    "pywayland.client",
    "pywayland.protocol.wayland",
    "pywayland.protocol.ext_foreign_toplevel_list_v1",
    "pywayland.protocol.ext_idle_notify_v1",
    "pywayland.protocol.ext_image_capture_source_v1",
    "pywayland.protocol.ext_image_copy_capture_v1",
    # The optional Qt companion runs in its own Windows Python environment.
    "PySide6.QtCore",
    "PySide6.QtGui",
    "PySide6.QtWebChannel",
    "PySide6.QtWebEngineCore",
    "PySide6.QtWebEngineWidgets",
    "PySide6.QtWidgets",
]

[tool.ty.rules]
import-not-found = "error"
unresolved-attribute = "error"
invalid-argument-type = "error"
no-matching-overload = "error"
# Rules ty leaves off by default, turned on so the imprecision they describe
# cannot creep back in. Keep the list to rules this codebase has cleared.
missing-type-argument = "error"
unsound-return-statement = "error"
unsound-assignment = "error"
dynamic-function-decorator-return = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
blanket-ignore-comment = "error"
unused-ignore-comment = "error"
redundant-cast = "error"
disjoint-cast = "error"
division-by-zero = "error"
invalid-legacy-positional-parameter = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"

[tool.vulture]
paths = ["docking", "tests"]
min_confidence = 100
sort_by_size = true
