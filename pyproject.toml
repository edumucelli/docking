[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docking"
version = "2.13.0"
description = "A lightweight, feature-rich dock for Linux written in Python with GTK 3 and Cairo"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "openmeteo-requests>=1.2",
    "requests-cache>=1.0",
    "retry-requests>=2.0",
]

[project.scripts]
docking = "docking.app:main"
docking-camshield-helper = "docking.applets.camshield.helper:main"

[project.optional-dependencies]
wayland = [
    "pywayland>=0.4.18",
]
dev = [
    "behave>=1.2.6",
    "Pillow>=11.0",
    "pytest>=7.0",
    "pytest-cov",
    "ruff==0.16.4",
    "scikit-image>=0.25",
    "ty==0.0.63",
    "vulture>=2.16",
]

[tool.uv]
config-settings-package = { pygobject-stubs = { config = "Gtk3,Gdk3" } }

[tool.setuptools.packages.find]
include = ["docking*"]

[tool.setuptools.package-data]
docking = [
    "assets/*.svg",
    "assets/*.png",
    "assets/clock/Default/*.svg",
    "assets/clock/Default24/*.svg",
    "assets/icons/*.png",
    "assets/icons/applets/*.png",
    "assets/themes/*.json",
    "assets/*.csv.gz",
    "assets/sounds/*.ogg",
    "assets/sounds/*.md",
    "assets/history/*.json",
    "assets/stretch/*.json",
    "platform/backends/wayland/protocols/*.xml",
    "locale/*.pot",
    "locale/*/LC_MESSAGES/*.mo",
    "locale/*/LC_MESSAGES/*.po",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not visual"'
markers = [
    "visual: screenshot-based visual regression tests",
]


[tool.coverage.run]
omit = [
    "docking/platform/__init__.py",
    "docking/platform/diagnostics.py",
    "docking/platform/gamescope.py",
    "docking/platform/icon_overrides.py",
    "docking/platform/model.py",
    "docking/platform/unity.py",
    "docking/platform/backends/**",
    "docking/platform/environment/**",
    "docking/platform/status_notifier/**",
    "docking/ui/preview.py",
    "docking/ui/renderer.py",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RUF", "PIE", "RET", "ISC", "PTH"]
ignore = [
    "E402",   # gi.require_version() must precede gi.repository imports
    "RUF001", # allow existing non-ASCII UI/test glyphs
    "RUF002", # avoid broad docstring punctuation churn
    "RUF003", # avoid broad comment punctuation churn
]  

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # test data strings can exceed line length
"tests/applets/test_weather_api.py" = ["N802"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
unresolved-import = "ignore"  # gi/cairo lack type stubs
unresolved-attribute = "ignore"  # gi.repository dynamic attrs
# openmeteo-requests has incomplete type stubs
invalid-argument-type = "warn"
no-matching-overload = "warn"

[tool.vulture]
paths = ["docking", "tests"]
min_confidence = 100
sort_by_size = true
