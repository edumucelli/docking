repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: docking-checks
        name: Docking checks
        entry: .githooks/pre-commit
        language: system
        pass_filenames: false
        always_run: true
