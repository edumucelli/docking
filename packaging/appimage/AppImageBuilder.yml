version: 1

script:
  - rm -rf AppDir
  - mkdir -p AppDir/usr/lib/python3/dist-packages
  - mkdir -p AppDir/usr/share/applications
  - mkdir -p AppDir/usr/share/icons
  - mkdir -p AppDir/usr/bin
  - ln -sf ../lib/__DEB_MULTIARCH__/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders AppDir/usr/bin/gdk-pixbuf-query-loaders
  - python3 -m pip install --upgrade pip
  - python3 -m pip install --no-cache-dir --target AppDir/usr/lib/python3/dist-packages .
  - install -Dm644 packaging/shared/org.docking.Docking.desktop AppDir/usr/share/applications/org.docking.Docking.desktop
  - install -Dm644 docking/platform/backends/gnome/extension/metadata.json AppDir/usr/share/gnome-shell/extensions/docking-bridge@docking.org/metadata.json
  - install -Dm644 docking/platform/backends/gnome/extension/extension.js AppDir/usr/share/gnome-shell/extensions/docking-bridge@docking.org/extension.js
  - cp -r packaging/deb/icons/hicolor AppDir/usr/share/icons/

AppDir:
  path: AppDir
  app_info:
    id: org.docking.Docking
    name: Docking
    icon: org.docking.Docking
    version: latest
    exec: usr/bin/python3
    exec_args: -m docking.app

  apt:
    arch: __APT_ARCH__
    sources:
      - sourceline: deb [arch=__APT_ARCH__] __APT_MIRROR__ jammy main universe
        key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
      - sourceline: deb [arch=__APT_ARCH__] __APT_MIRROR__ jammy-updates main universe
        key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
      - sourceline: deb [arch=__APT_ARCH__] __APT_MIRROR__ jammy-security main universe
        key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
    include:
      - python3
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - gir1.2-gtk-3.0
      - gir1.2-gtklayershell-0.1
      - gir1.2-gdkpixbuf-2.0
      - gir1.2-wnck-3.0
      - gir1.2-pango-1.0
      - gir1.2-nm-1.0
      - gir1.2-gstreamer-1.0
      - gir1.2-webkit2-4.0
      - libgtk-3-0
      - libgtk-layer-shell0
      - libglib2.0-bin
      - libwnck-3-0
      - libgdk-pixbuf-2.0-0
      - libgdk-pixbuf2.0-bin
      - libpangocairo-1.0-0
      - libcairo2
      - libwayland-client0
      - libwayland-server0
      - libnm0
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - librsvg2-common
      - hicolor-icon-theme

  runtime:
    env:
      PYTHONPATH: $APPDIR/usr/lib/python3/dist-packages
      GI_TYPELIB_PATH: __GI_TYPELIB_PATH__
      XDG_DATA_DIRS: $APPDIR/usr/share:$XDG_DATA_DIRS
      GSETTINGS_BACKEND: memory

AppImage:
  arch: __APPIMAGE_ARCH__
  file_name: Docking-__APPIMAGE_ARCH__.AppImage
