name: docking
title: Docking
base: core22
version: "2.3.0"
summary: Feature-rich Linux dock in Python with GTK 3 and Cairo
description: |
  A lightweight, feature-rich dock for Linux written in Python with GTK 3 and Cairo.
  Inspired by Plank and Cairo-Dock, it provides pinned launchers, window
  indicators, previews, autohide, drag-and-drop, and an extensible
  applet system.
contact: https://github.com/edumucelli/docking/issues
license: GPL-3.0-or-later
issues: https://github.com/edumucelli/docking/issues
source-code: https://github.com/edumucelli/docking
website: https://github.com/edumucelli/docking
grade: stable
confinement: devmode

apps:
  docking:
    command: bin/docking
    desktop: usr/share/applications/org.docking.Docking.desktop
    plugs:
      - x11
      - wayland
      - desktop
      - desktop-legacy
      - network
      - network-manager
      - audio-playback
      - home

parts:
  docking:
    plugin: python
    source: ../..
    build-packages:
      - pkg-config
      - libcairo2-dev
      - libgirepository1.0-dev
      - libwayland-dev
      - wayland-protocols
      - gettext
    python-packages:
      - pywayland==0.4.18
    stage-packages:
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - gir1.2-gtk-3.0
      - gir1.2-gtklayershell-0.1
      - gir1.2-wnck-3.0
      - gir1.2-gdkpixbuf-2.0
      - gir1.2-pango-1.0
      - gir1.2-nm-1.0
      - gir1.2-gstreamer-1.0
      - librsvg2-common
      - ca-certificates
    override-build: |
      bash "$CRAFT_PART_SRC/tools/i18n.sh" --compile
      craftctl default
      mv "${CRAFT_PART_INSTALL}/bin/docking" "${CRAFT_PART_INSTALL}/bin/docking-real"
      cat > "${CRAFT_PART_INSTALL}/bin/docking" <<'EOF'
      #!/bin/sh
      set -eu
      exec "$SNAP/bin/docking-real" "$@"
      EOF
      chmod 0755 "${CRAFT_PART_INSTALL}/bin/docking"
      install -Dm644 "$CRAFT_PROJECT_DIR/../shared/org.docking.Docking.desktop" \
        "${CRAFT_PART_INSTALL}/usr/share/applications/org.docking.Docking.desktop"

      if [ -f "$CRAFT_PROJECT_DIR/../../images/docking.png" ]; then
        install -Dm644 "$CRAFT_PROJECT_DIR/../../images/docking.png" \
          "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/512x512/apps/org.docking.Docking.png"
        install -Dm644 "$CRAFT_PROJECT_DIR/../../images/docking.png" \
          "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/512x512/apps/docking.png"
      else
        echo "Required icon not found: images/docking.png"
        pwd
        ls -la
        exit 1
      fi
