name: LXDE mapping investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mapping:
    name: Inspect native LXDE mapping
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build diagnostic desktop image
        uses: docker/build-push-action@v7
        with:
          context: tests/visual/shared/linux
          file: tests/visual/shared/linux/Dockerfile
          target: x11-lxde
          tags: docking-ci:lxde-mapping
          load: true
          cache-from: type=gha,scope=compositor-x11-lxde
      - name: Repeat cold native desktop starts
        env:
          DOCKING_LAB_IMAGE: docking-ci:lxde-mapping
        run: |
          failures=0
          for attempt in $(seq 12); do
            if python3 -m tests.visual --target x11-lxde --output "artifacts/visual/lxde-$attempt"; then
              echo "LXDE $attempt passed"
            else
              echo "LXDE $attempt failed"
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lxde-mapping-investigation
          path: artifacts/visual/
          retention-days: 7
