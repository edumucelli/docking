name: Website

on:
  push:
    branches: [master]
    paths: ["website/**", "netlify.toml", "docking/assets/icons/applets/**", "packaging/deb/icons/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "netlify.toml", "docking/assets/icons/applets/**", "packaging/deb/icons/**", ".github/workflows/website.yml"]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
